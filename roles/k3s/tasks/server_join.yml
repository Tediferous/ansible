---
- name: Check if k3s server unit exists
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s.service
  register: k3s_unit

- name: Detect disallowed node-role label in k3s unit
  ansible.builtin.command: grep -F "node-role.kubernetes.io/worker" /etc/systemd/system/k3s.service
  register: k3s_bad_label
  changed_when: false
  failed_when: false
  when: k3s_unit.stat.exists
  become: "{{ k3s_become }}"

- name: Join or repair k3s server
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
      {% if k3s_version | length > 0 %}INSTALL_K3S_VERSION="{{ k3s_version }}" {% endif %}sh -s - server \
      --server https://{{ k3s_api_host }}:6443 \
      --token {{ k3s_token }} \
      {{ k3s_server_args }}
  become: "{{ k3s_become }}"
  when: not k3s_unit.stat.exists or (k3s_bad_label.rc | default(1)) == 0
  no_log: true

- name: Ensure k3s service is enabled and running
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
  become: "{{ k3s_become }}"
