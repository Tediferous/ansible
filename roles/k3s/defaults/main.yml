---
k3s_version: ""  # empty = latest stable
k3s_become: true

# Required on Raspberry Pi for k3s (appended to /boot[/firmware]/cmdline.txt).
k3s_cgroup_cmdline_params:
  - cgroup_memory=1
  - cgroup_enable=memory

# Single control-plane per cluster (red). Remains schedulable as a worker by
# default — do not add NoSchedule/NoExecute control-plane taints.
# Do not set node-role.kubernetes.io/* via --node-label; kubelet rejects it.
k3s_server_args: >-
  --disable traefik

k3s_agent_args: ""
k3s_kubeconfig_local_path: "{{ playbook_dir }}/../kubeconfigs"
k3s_fetch_kubeconfig: true
